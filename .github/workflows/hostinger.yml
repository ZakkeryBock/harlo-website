# Builds the static site and publishes it to the `hostinger` branch, which
# Hostinger's Git deployment serves as-is (it copies files; it can't run a
# Next.js build). Push to main (or redesign) and the branch is rebuilt; then press Deploy in
# hPanel (or turn on auto-deploy there).
name: Publish to Hostinger branch

on:
  push:
    branches: [main, redesign]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A lockfile written on Windows can miss Linux-only native packages; fall back to a fresh install.
      - run: npm ci || (rm -rf node_modules package-lock.json && npm install --no-audit --no-fund)
      # Production URLs are the defaults in src/lib/site.ts; nothing secret is needed.
      - run: npm run build
      - name: Publish out/ to the hostinger branch
        run: |
          cd out
          touch .nojekyll
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hostinger
